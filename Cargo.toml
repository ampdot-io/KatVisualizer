[package]
name    = "katvisualizer"
version = "0.10.4"
edition = "2024"

[workspace]
members = [
	"xtask",
]

[lib]
crate-type = [
	"cdylib",
	"lib",
]

[[bin]]
name = "katvisualizer_wasm"
path = "src/bin/katvisualizer_wasm.rs"
required-features = ["wasm"]

[features]
default = [ "midi" ]
force-mono = [  ]
force-stereo = [  ]
force-mono-to-stereo = [
]
mute-output = [  ]
midi = [  ]
wasm = []

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nih_plug = { git = "https://github.com/transkatgirl/nih-plug.git", rev = "1f132feff0b03df8b5078ffaa1087201c9545d3f", features = [
	"assert_process_allocs",
	"standalone",
] }
nih_plug_egui = { git = "https://github.com/transkatgirl/nih-plug.git", rev = "1f132feff0b03df8b5078ffaa1087201c9545d3f" }
threadpool = "1.8.1"
rosc = "0.11.4"
mimalloc = { version = "0.1.48", features = [
	"v3",
] }

[dependencies]
serde = { version = "1.0", features = [
	"derive",
] }
color = "0.3.2"
parking_lot = "0.12.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
eframe = "0.27"
cpal = { version = "0.15", features = ["wasm-bindgen"] }
console_error_panic_hook = "0.1"
console_log = "1.0"
log = "0.4"
web-time = "1.1"
web-sys = { version = "0.3", features = [
    "AudioContext",
    "AudioNode",
    "AudioDestinationNode",
    "Window",
    "Navigator",
    "MediaDevices",
    "MediaStream",
    "AudioContextOptions",
    "MediaStreamAudioSourceNode",
    "ScriptProcessorNode",
    "AudioWorklet",
    "AudioWorkletNode",
    "MessageEvent",
    "console",
] }

[profile.dev]
opt-level = 3

[profile.release]
lto           = "fat"
codegen-units = 1
strip         = "symbols"
panic         = "abort"
