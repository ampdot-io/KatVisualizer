[package]
name    = "katvisualizer"
version = "0.10.4"
edition = "2024"

[workspace]
members = [
	"xtask",
]

[lib]
crate-type = [
	"cdylib",
	"lib",
]

[[bin]]
name = "katvisualizer_wasm"
path = "src/bin/kat_wasm.rs"

[features]
default = [ "midi" ]
force-mono = [  ]
force-stereo = [  ]
force-mono-to-stereo = [
]
mute-output = [  ]
midi = [  ]

[dependencies]
serde = { version = "1.0", features = [
	"derive",
] }
color = "0.3.2"
parking_lot = "0.12.5"
eframe = "0.33.3"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.56"
web-sys = { version = "0.3.83", features = ["AudioContext", "AudioBufferSourceNode", "AudioBuffer", "AudioProcessingEvent", "ScriptProcessorNode", "AudioDestinationNode", "File", "Blob", "OscillatorNode", "AudioContextState", "OscillatorType", "AudioParam"] }
web-time = "1.1.0"
log = "0.4.29"
js-sys = "0.3.83"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = { version = "0.1.48", features = [
	"v3",
] }
nih_plug = { git = "https://github.com/transkatgirl/nih-plug.git", rev = "1f132feff0b03df8b5078ffaa1087201c9545d3f", features = [
	"assert_process_allocs",
	"standalone",
] }
nih_plug_egui = { git = "https://github.com/transkatgirl/nih-plug.git", rev = "1f132feff0b03df8b5078ffaa1087201c9545d3f" }
threadpool = "1.8.1"
voracious_radix_sort = "1.2.0"
rosc = "0.11.4"

[profile.dev]
opt-level = 3

[profile.release]
lto           = "fat"
codegen-units = 1
strip         = "symbols"
panic         = "abort"
