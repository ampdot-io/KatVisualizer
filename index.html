<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>KatVisualizer WASM</title>
    <style>
        html {
            height: 100%;
        }
        body {
            height: 100%;
            margin: 0;
            background-color: #202020;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script type="module">
        import init, { start } from './katvisualizer_wasm.js';

        async function main() {
            await init();

            // Wait for user interaction to start audio context (browser policy)
            const startBtn = document.createElement('button');
            startBtn.textContent = "Start Visualizer (Requires Microphone)";
            startBtn.style.padding = "20px";
            startBtn.style.fontSize = "20px";
            startBtn.style.position = "absolute";
            startBtn.style.zIndex = "10";

            startBtn.onclick = async () => {
                startBtn.remove();
                try {
                    await start("canvas");
                } catch (e) {
                    console.error("Error starting visualizer:", e);
                    alert("Failed to start visualizer. Check console for details.");
                }
            };

            document.body.appendChild(startBtn);
        }

        main();
    </script>
</body>
</html>
