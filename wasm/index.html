<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KatVisualizer - Realtime Music Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow: hidden;
        }

        #container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #canvas {
            flex: 1;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }

        button {
            background: #4a9eff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
            transition: background 0.2s;
        }

        button:hover {
            background: #3a8eef;
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .slider-group {
            margin: 10px 0;
        }

        .slider-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            color: #aaa;
        }

        input[type="range"] {
            width: 200px;
            margin: 5px 0;
        }

        #info {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            font-size: 12px;
            color: #aaa;
            backdrop-filter: blur(10px);
        }

        #info div {
            margin: 3px 0;
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="canvas"></canvas>

        <div id="controls">
            <button id="startBtn">Start Microphone</button>
            <div class="slider-group">
                <label>Gain: <span id="gainValue">0 dB</span></label>
                <input type="range" id="gainSlider" min="-40" max="40" value="0" step="1">
            </div>
            <div class="slider-group">
                <label>Resolution: <span id="resValue">256</span></label>
                <input type="range" id="resSlider" min="64" max="1024" value="256" step="64">
            </div>
        </div>

        <div id="info">
            <div><strong>KatVisualizer</strong></div>
            <div>ERB-scale VQT + Masking</div>
            <div id="fps">FPS: 0</div>
            <div id="freq">Bins: 0</div>
        </div>
    </div>

    <script type="module">
        import init, { MusicVisualizer } from './pkg/katvisualizer_wasm.js';

        let audioContext;
        let analyserNode;
        let visualizer;
        let animationId;
        let canvas, ctx;
        let resolution = 256;
        let sampleRate = 48000;
        let fpsCounter = 0;
        let lastFpsUpdate = 0;

        // Initialize
        async function setup() {
            await init();

            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');

            // Set canvas size
            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            // Controls
            document.getElementById('startBtn').addEventListener('click', startAudio);
            document.getElementById('gainSlider').addEventListener('input', (e) => {
                const gain = parseFloat(e.target.value);
                document.getElementById('gainValue').textContent = gain + ' dB';
                if (visualizer) visualizer.set_gain(gain);
            });
            document.getElementById('resSlider').addEventListener('input', (e) => {
                const newRes = parseInt(e.target.value);
                document.getElementById('resValue').textContent = newRes;
                resolution = newRes;
                if (audioContext) {
                    stopAudio();
                    setTimeout(() => startAudio(), 100);
                }
            });
        }

        async function startAudio() {
            try {
                const btn = document.getElementById('startBtn');
                btn.disabled = true;
                btn.textContent = 'Initializing...';

                // Setup audio context
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                sampleRate = audioContext.sampleRate;

                // Get microphone
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false
                    }
                });

                const source = audioContext.createMediaStreamSource(stream);

                // Create analyzer
                analyserNode = audioContext.createAnalyser();
                analyserNode.fftSize = 4096;
                analyserNode.smoothingTimeConstant = 0;

                source.connect(analyserNode);

                // Create visualizer
                visualizer = new MusicVisualizer(resolution, sampleRate);
                document.getElementById('freq').textContent = 'Bins: ' + visualizer.get_frequency_count();

                btn.textContent = 'Running';
                btn.style.background = '#2ecc71';

                // Start animation
                animate();
            } catch (err) {
                console.error('Error starting audio:', err);
                document.getElementById('startBtn').textContent = 'Error - Try Again';
                document.getElementById('startBtn').disabled = false;
            }
        }

        function stopAudio() {
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
        }

        function animate() {
            animationId = requestAnimationFrame(animate);

            if (!analyserNode || !visualizer) return;

            // Get audio data
            const bufferSize = analyserNode.fftSize;
            const buffer = new Float32Array(bufferSize);
            analyserNode.getFloatTimeDomainData(buffer);

            // Analyze
            const spectrum = visualizer.analyze(buffer);
            const frequencies = visualizer.get_frequencies();

            // Draw
            draw(spectrum, frequencies);

            // Update FPS
            fpsCounter++;
            const now = performance.now();
            if (now - lastFpsUpdate > 1000) {
                document.getElementById('fps').textContent = 'FPS: ' + fpsCounter;
                fpsCounter = 0;
                lastFpsUpdate = now;
            }
        }

        function draw(spectrum, frequencies) {
            const w = canvas.width;
            const h = canvas.height;
            const bins = spectrum.length / 2;

            // Clear
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, w, h);

            // Draw spectrum bars
            const barWidth = w / bins;

            for (let i = 0; i < bins; i++) {
                const pan = spectrum[i * 2];
                const value = spectrum[i * 2 + 1];
                const freq = frequencies[i];

                // Color based on frequency (rainbow)
                const hue = Math.log2(freq / 20) / Math.log2(20000 / 20) * 360;
                const lightness = 30 + value * 50;
                const chroma = value * 80;

                // Convert OkLCH-like to HSL (simplified)
                const saturation = Math.min(100, chroma);
                ctx.fillStyle = `hsl(${hue}, ${saturation}%, ${lightness}%)`;

                const barHeight = value * h * 0.8;
                const x = i * barWidth;
                const y = h - barHeight;

                ctx.fillRect(x, y, barWidth - 1, barHeight);
            }

            // Draw frequency labels
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.font = '10px monospace';
            const labelFreqs = [20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000];

            labelFreqs.forEach(targetFreq => {
                let closestIdx = 0;
                let closestDiff = Infinity;

                for (let i = 0; i < bins; i++) {
                    const diff = Math.abs(frequencies[i] - targetFreq);
                    if (diff < closestDiff) {
                        closestDiff = diff;
                        closestIdx = i;
                    }
                }

                const x = closestIdx * barWidth;
                ctx.fillText(targetFreq >= 1000 ? (targetFreq/1000)+'k' : targetFreq+'', x + 2, h - 5);
            });
        }

        // Start on load
        setup();
    </script>
</body>
</html>
