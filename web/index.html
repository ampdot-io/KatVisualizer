<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KatVisualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a1a;
            color: #e0e0e0;
            font-family: monospace;
            font-size: 12px;
            overflow: hidden;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 16px;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
        }
        #stats-left, #stats-right {
            text-shadow: 0 0 4px rgba(0,0,0,0.8);
            white-space: pre;
        }
        #stats-right {
            text-align: right;
        }
        #settings-btn {
            position: absolute;
            right: 16px;
            top: 80px;
            padding: 8px 16px;
            background: rgba(40, 40, 40, 0.8);
            border: 1px solid #444;
            color: #e0e0e0;
            cursor: pointer;
            font-family: monospace;
            pointer-events: all;
            z-index: 100;
        }
        #settings-btn:hover {
            background: rgba(60, 60, 60, 0.9);
        }
        #settings-panel {
            position: absolute;
            right: 16px;
            top: 120px;
            background: rgba(30, 30, 30, 0.95);
            border: 1px solid #444;
            padding: 16px;
            display: none;
            max-height: 60vh;
            overflow-y: auto;
            pointer-events: all;
            z-index: 99;
        }
        #settings-panel.open {
            display: block;
        }
        #settings-panel h3 {
            margin-bottom: 12px;
            border-bottom: 1px solid #444;
            padding-bottom: 8px;
        }
        .setting-row {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .setting-row label {
            min-width: 140px;
        }
        .setting-row input[type="range"] {
            width: 100px;
        }
        .setting-row input[type="number"] {
            width: 60px;
            background: #333;
            border: 1px solid #555;
            color: #e0e0e0;
            padding: 2px 4px;
        }
        #start-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 40px;
            font-size: 18px;
            background: rgba(40, 40, 40, 0.9);
            border: 2px solid #666;
            color: #e0e0e0;
            cursor: pointer;
            font-family: monospace;
        }
        #start-btn:hover {
            background: rgba(60, 60, 60, 0.95);
            border-color: #888;
        }
        #start-btn.hidden {
            display: none;
        }
        #drop-zone {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.8);
            border: 4px dashed #666;
            z-index: 200;
        }
        #drop-zone.active {
            display: flex;
        }
        #drop-zone span {
            font-size: 24px;
            color: #888;
        }
        #audio-controls {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 12px;
            align-items: center;
            background: rgba(30, 30, 30, 0.9);
            padding: 8px 16px;
            border-radius: 4px;
            border: 1px solid #444;
        }
        #audio-controls.visible {
            display: flex;
        }
        #audio-controls button {
            padding: 6px 12px;
            background: #333;
            border: 1px solid #555;
            color: #e0e0e0;
            cursor: pointer;
            font-family: monospace;
        }
        #audio-controls button:hover {
            background: #444;
        }
        #audio-controls #file-name {
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #audio-controls input[type="range"] {
            width: 100px;
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="canvas"></canvas>
        <div id="overlay">
            <div id="stats-left"></div>
            <div id="stats-right"></div>
        </div>
        <button id="settings-btn">Settings</button>
        <div id="settings-panel">
            <h3>Settings</h3>
            <div class="setting-row">
                <label>Left Hue:</label>
                <input type="range" id="left-hue" min="0" max="360" value="195">
                <span id="left-hue-val">195</span>
            </div>
            <div class="setting-row">
                <label>Right Hue:</label>
                <input type="range" id="right-hue" min="0" max="360" value="328">
                <span id="right-hue-val">328</span>
            </div>
            <div class="setting-row">
                <label>Bargraph Height:</label>
                <input type="range" id="bargraph-height" min="0" max="100" value="33">
                <span id="bargraph-height-val">33%</span>
            </div>
        </div>
        <button id="start-btn">Click to Start (or drop audio file)</button>
        <div id="drop-zone"><span>Drop audio file here</span></div>
        <div id="audio-controls">
            <button id="play-pause-btn">Play</button>
            <input type="range" id="seek-bar" min="0" max="100" value="0">
            <span id="time-display">0:00 / 0:00</span>
            <input type="range" id="volume-slider" min="0" max="100" value="100">
            <span id="file-name"></span>
        </div>
    </div>

    <script type="module">
        import init, { Visualizer } from './pkg/katvisualizer_web.js';

        let visualizer = null;
        let audioContext = null;
        let scriptProcessor = null;
        let isRunning = false;
        let lastFrameTime = 0;
        let frameTime = 0;
        let rasterizeTime = 0;
        let processingTime = 0;

        // Audio file playback state
        let audioBuffer = null;
        let audioSource = null;
        let gainNode = null;
        let isPlaying = false;
        let startTime = 0;
        let pauseTime = 0;

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statsLeft = document.getElementById('stats-left');
        const statsRight = document.getElementById('stats-right');
        const settingsBtn = document.getElementById('settings-btn');
        const settingsPanel = document.getElementById('settings-panel');
        const startBtn = document.getElementById('start-btn');
        const dropZone = document.getElementById('drop-zone');
        const audioControls = document.getElementById('audio-controls');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const seekBar = document.getElementById('seek-bar');
        const timeDisplay = document.getElementById('time-display');
        const volumeSlider = document.getElementById('volume-slider');
        const fileNameDisplay = document.getElementById('file-name');

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            if (visualizer) {
                visualizer.set_canvas_size(canvas.width, canvas.height);
            }
        }

        window.addEventListener('resize', resizeCanvas);

        settingsBtn.addEventListener('click', () => {
            settingsPanel.classList.toggle('open');
        });

        document.getElementById('left-hue').addEventListener('input', (e) => {
            document.getElementById('left-hue-val').textContent = e.target.value;
            if (visualizer) {
                visualizer.set_colors(
                    parseFloat(e.target.value),
                    parseFloat(document.getElementById('right-hue').value)
                );
            }
        });

        document.getElementById('right-hue').addEventListener('input', (e) => {
            document.getElementById('right-hue-val').textContent = e.target.value;
            if (visualizer) {
                visualizer.set_colors(
                    parseFloat(document.getElementById('left-hue').value),
                    parseFloat(e.target.value)
                );
            }
        });

        document.getElementById('bargraph-height').addEventListener('input', (e) => {
            document.getElementById('bargraph-height-val').textContent = e.target.value + '%';
            if (visualizer) {
                visualizer.set_bargraph_height(parseFloat(e.target.value) / 100);
            }
        });

        async function startAudio() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const sampleRate = audioContext.sampleRate;

                await init();

                visualizer = new Visualizer(sampleRate, 512);
                resizeCanvas();

                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false
                    }
                });

                const source = audioContext.createMediaStreamSource(stream);

                // Use ScriptProcessorNode for direct sample access
                // Buffer size 2048 at 48kHz = ~42ms latency, good balance
                const bufferSize = 2048;
                scriptProcessor = audioContext.createScriptProcessor(bufferSize, 2, 2);

                scriptProcessor.onaudioprocess = (e) => {
                    const processStart = performance.now();

                    const leftChannel = e.inputBuffer.getChannelData(0);
                    const rightChannel = e.inputBuffer.numberOfChannels > 1
                        ? e.inputBuffer.getChannelData(1)
                        : leftChannel;

                    if (leftChannel === rightChannel || e.inputBuffer.numberOfChannels === 1) {
                        visualizer.process_mono(leftChannel);
                    } else {
                        visualizer.process_stereo(leftChannel, rightChannel);
                    }

                    processingTime = performance.now() - processStart;
                };

                source.connect(scriptProcessor);
                scriptProcessor.connect(audioContext.destination);

                isRunning = true;
                startBtn.classList.add('hidden');
                requestAnimationFrame(render);

            } catch (err) {
                console.error('Error starting audio:', err);
                alert('Could not access microphone. Please allow microphone access.');
            }
        }

        function render(timestamp) {
            if (!isRunning) return;

            frameTime = timestamp - lastFrameTime;
            lastFrameTime = timestamp;

            const rasterStart = performance.now();

            try {
                visualizer.render(ctx);
            } catch (err) {
                console.error('Render error:', err);
            }

            rasterizeTime = performance.now() - rasterStart;

            // Update stats
            const freq = visualizer.get_peak_frequency();
            const amp = visualizer.get_peak_amplitude();
            const pan = visualizer.get_pan();

            statsLeft.textContent = `${freq.toFixed(0)}hz
${amp.toFixed(0)}dBFS, ${pan >= 0 ? '+' : ''}${pan.toFixed(2)} pan`;

            const frameMs = frameTime.toFixed(0);
            const rasterMs = rasterizeTime.toFixed(1);
            const rasterPct = ((rasterizeTime / frameTime) * 100).toFixed(0);
            const processMs = processingTime.toFixed(1);
            const processPct = ((processingTime / frameTime) * 100).toFixed(0);

            statsRight.textContent = `${frameMs}ms frame
${rasterPct}% (${rasterMs}ms) rasterize
${processPct}% (${processMs}ms) processing`;

            requestAnimationFrame(render);
        }

        startBtn.addEventListener('click', startAudio);

        // Drag and drop handling
        document.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('active');
        });

        document.addEventListener('dragleave', (e) => {
            if (e.relatedTarget === null || !document.contains(e.relatedTarget)) {
                dropZone.classList.remove('active');
            }
        });

        dropZone.addEventListener('dragleave', (e) => {
            if (!dropZone.contains(e.relatedTarget)) {
                dropZone.classList.remove('active');
            }
        });

        document.addEventListener('drop', async (e) => {
            e.preventDefault();
            dropZone.classList.remove('active');

            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('audio/')) {
                await loadAudioFile(file);
            }
        });

        async function loadAudioFile(file) {
            try {
                // Initialize audio context and visualizer if needed
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (!visualizer) {
                    await init();
                    visualizer = new Visualizer(audioContext.sampleRate, 512);
                    resizeCanvas();
                }

                // Stop any current playback
                stopAudio();

                // Decode audio file
                const arrayBuffer = await file.arrayBuffer();
                audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

                // Set up gain node
                if (!gainNode) {
                    gainNode = audioContext.createGain();
                    gainNode.connect(audioContext.destination);
                }

                // Update UI
                fileNameDisplay.textContent = file.name;
                audioControls.classList.add('visible');
                startBtn.classList.add('hidden');
                seekBar.value = 0;
                updateTimeDisplay(0);

                // Start playback
                playAudio(0);

                // Start visualization if not running
                if (!isRunning) {
                    isRunning = true;
                    requestAnimationFrame(render);
                }

            } catch (err) {
                console.error('Error loading audio file:', err);
                alert('Could not load audio file: ' + err.message);
            }
        }

        function playAudio(offset = pauseTime) {
            if (!audioBuffer) return;

            // Create new source (sources can only be used once)
            audioSource = audioContext.createBufferSource();
            audioSource.buffer = audioBuffer;

            // Create script processor for visualization
            const bufferSize = 2048;
            if (scriptProcessor) {
                scriptProcessor.disconnect();
            }
            scriptProcessor = audioContext.createScriptProcessor(bufferSize, 2, 2);

            scriptProcessor.onaudioprocess = (e) => {
                const processStart = performance.now();

                const leftChannel = e.inputBuffer.getChannelData(0);
                const rightChannel = e.inputBuffer.numberOfChannels > 1
                    ? e.inputBuffer.getChannelData(1)
                    : leftChannel;

                if (audioBuffer.numberOfChannels === 1) {
                    visualizer.process_mono(leftChannel);
                } else {
                    visualizer.process_stereo(leftChannel, rightChannel);
                }

                processingTime = performance.now() - processStart;
            };

            // Connect: source -> scriptProcessor -> gain -> destination
            audioSource.connect(scriptProcessor);
            scriptProcessor.connect(gainNode);

            audioSource.onended = () => {
                if (isPlaying && getCurrentTime() >= audioBuffer.duration - 0.1) {
                    stopAudio();
                    pauseTime = 0;
                    seekBar.value = 0;
                    updateTimeDisplay(0);
                }
            };

            startTime = audioContext.currentTime - offset;
            audioSource.start(0, offset);
            isPlaying = true;
            playPauseBtn.textContent = 'Pause';
        }

        function pauseAudio() {
            if (!isPlaying) return;
            pauseTime = getCurrentTime();
            audioSource.stop();
            isPlaying = false;
            playPauseBtn.textContent = 'Play';
        }

        function stopAudio() {
            if (audioSource) {
                try { audioSource.stop(); } catch (e) {}
                audioSource = null;
            }
            isPlaying = false;
            playPauseBtn.textContent = 'Play';
        }

        function getCurrentTime() {
            if (!isPlaying) return pauseTime;
            return audioContext.currentTime - startTime;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function updateTimeDisplay(currentTime) {
            const duration = audioBuffer ? audioBuffer.duration : 0;
            timeDisplay.textContent = `${formatTime(currentTime)} / ${formatTime(duration)}`;
        }

        // Playback controls
        playPauseBtn.addEventListener('click', () => {
            if (isPlaying) {
                pauseAudio();
            } else {
                playAudio();
            }
        });

        seekBar.addEventListener('input', () => {
            if (!audioBuffer) return;
            const seekTime = (seekBar.value / 100) * audioBuffer.duration;
            updateTimeDisplay(seekTime);
        });

        seekBar.addEventListener('change', () => {
            if (!audioBuffer) return;
            const seekTime = (seekBar.value / 100) * audioBuffer.duration;
            const wasPlaying = isPlaying;
            stopAudio();
            pauseTime = seekTime;
            if (wasPlaying) {
                playAudio(seekTime);
            }
        });

        volumeSlider.addEventListener('input', () => {
            if (gainNode) {
                gainNode.gain.value = volumeSlider.value / 100;
            }
        });

        // Update seek bar during playback
        setInterval(() => {
            if (isPlaying && audioBuffer) {
                const currentTime = getCurrentTime();
                seekBar.value = (currentTime / audioBuffer.duration) * 100;
                updateTimeDisplay(currentTime);
            }
        }, 100);

        // Initialize canvas on load
        resizeCanvas();
    </script>
</body>
</html>
