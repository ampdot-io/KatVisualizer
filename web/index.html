<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KatVisualizer - Music Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>KatVisualizer</h1>
            <p>A realtime music visualizer designed to better match human hearing</p>
        </header>

        <div class="controls">
            <div class="file-section">
                <label for="audioFile" class="file-label">
                    <span>Choose Audio File</span>
                    <input type="file" id="audioFile" accept="audio/*">
                </label>
                <span id="fileName">No file selected</span>
            </div>

            <div class="playback-controls">
                <button id="playButton" disabled>Play</button>
                <button id="pauseButton" disabled>Pause</button>
                <button id="stopButton" disabled>Stop</button>
            </div>

            <div class="progress-bar">
                <div id="progressFill"></div>
                <span id="timeDisplay">0:00 / 0:00</span>
            </div>
        </div>

        <div class="visualizer-container">
            <canvas id="visualizer"></canvas>
            <div id="loadingOverlay" class="loading-overlay">
                <div class="spinner"></div>
                <p>Loading WASM module...</p>
            </div>
        </div>

        <div class="settings">
            <details>
                <summary>Analysis Settings</summary>
                <div class="settings-grid">
                    <div class="setting">
                        <label for="resolution">Resolution: <span id="resolutionValue">512</span></label>
                        <input type="range" id="resolution" min="128" max="1024" step="64" value="512">
                    </div>
                    <div class="setting">
                        <label for="gain">Gain (dB): <span id="gainValue">0.0</span></label>
                        <input type="range" id="gain" min="-20" max="20" step="0.5" value="0">
                    </div>
                    <div class="setting">
                        <label for="listeningVolume">Listening Volume (dB SPL): <span id="listeningVolumeValue">86.0</span></label>
                        <input type="range" id="listeningVolume" min="60" max="120" step="1" value="86">
                    </div>
                    <div class="setting">
                        <label for="erbBandwidthDiv">ERB Bandwidth Divisor: <span id="erbBandwidthDivValue">2.0</span></label>
                        <input type="range" id="erbBandwidthDiv" min="0.5" max="8" step="0.1" value="2">
                    </div>
                    <div class="setting">
                        <label>
                            <input type="checkbox" id="erbFreqScale" checked>
                            ERB Frequency Scale
                        </label>
                    </div>
                    <div class="setting">
                        <label>
                            <input type="checkbox" id="erbTimeRes" checked>
                            ERB Time Resolution
                        </label>
                    </div>
                    <div class="setting">
                        <label>
                            <input type="checkbox" id="ncMethod" checked>
                            NC Method Windowing
                        </label>
                    </div>
                    <div class="setting">
                        <label>
                            <input type="checkbox" id="masking" checked>
                            Simultaneous Masking
                        </label>
                    </div>
                    <div class="setting">
                        <label>
                            <input type="checkbox" id="normalizeAmplitude" checked>
                            Normalize Amplitude
                        </label>
                    </div>
                </div>
            </details>

            <details>
                <summary>Render Settings</summary>
                <div class="settings-grid">
                    <div class="setting">
                        <label for="colorHue">Color Hue: <span id="colorHueValue">180</span></label>
                        <input type="range" id="colorHue" min="0" max="360" step="1" value="180">
                    </div>
                    <div class="setting">
                        <label for="brightness">Brightness: <span id="brightnessValue">1.0</span></label>
                        <input type="range" id="brightness" min="0.5" max="2.0" step="0.1" value="1.0">
                    </div>
                    <div class="setting">
                        <label for="barSpacing">Bar Spacing: <span id="barSpacingValue">2</span></label>
                        <input type="range" id="barSpacing" min="0" max="10" step="1" value="2">
                    </div>
                    <div class="setting">
                        <label>
                            <input type="checkbox" id="showMasking">
                            Show Masking Thresholds
                        </label>
                    </div>
                </div>
            </details>
        </div>

        <div class="info">
            <div class="info-item">
                <strong>FPS:</strong> <span id="fps">0</span>
            </div>
            <div class="info-item">
                <strong>Frequency Bins:</strong> <span id="binCount">0</span>
            </div>
            <div class="info-item">
                <strong>Mean Level:</strong> <span id="meanLevel">-∞ dB</span>
            </div>
            <div class="info-item">
                <strong>Peak Level:</strong> <span id="peakLevel">-∞ dB</span>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
